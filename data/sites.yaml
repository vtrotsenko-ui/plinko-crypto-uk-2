# Single-site portfolio for the Argentina 1win affiliate project.
#
# `domain` is a placeholder until a live AR-focused domain is wired up.
# K7 (legality) and K10 (responsible gambling) trust pages are NOT listed
# here - assign-clusters.ts adds them to every site automatically.

sites:
  - id: 1win-argentina
    domain: 1win-argentina-guide.com
    name: "1win Argentina Guide"
    positioning: >
      English-language informational and commercial hub for adults in Argentina
      researching 1win: official access paths, casino and sportsbook overview,
      mobile apps, login help, bonus terms literacy, and popular crash/instant
      games. Transparent affiliate disclosures, 18+ messaging, and responsible
      gambling resources on every page.
    pages:
      - slug: "/"
        page_type: home
        intent: commercial
        cluster_match: "^1win$"
        primary_keyword: "1win"
        priority: 1.0
      - slug: "/1win-casino/"
        page_type: landing
        intent: commercial
        cluster_match: "1win casino|casino 1win|1win casino online"
        primary_keyword: "1win casino"
        priority: 0.9
      - slug: "/1win-app/"
        page_type: landing
        intent: transactional
        cluster_match: "1win app|1win apk|1win casino app|1win download"
        primary_keyword: "1win app"
        priority: 0.85
      - slug: "/1win-login/"
        page_type: landing
        intent: transactional
        cluster_match: "1win login|1win register|1win casino login"
        primary_keyword: "1win login"
        priority: 0.8
      - slug: "/bonus-code-1win/"
        page_type: landing
        intent: transactional
        cluster_match: "bonus code 1win|1win bonus|1win promo code|1win bonus code"
        primary_keyword: "bonus code 1win"
        priority: 0.8
      - slug: "/1win-aviator/"
        page_type: landing
        intent: commercial
        cluster_match: "1win aviator|aviator 1win|aviator game 1win"
        primary_keyword: "1win aviator"
        priority: 0.75
      - slug: "/1win-argentina/"
        page_type: landing
        intent: commercial
        cluster_match: "1win argentina|1win casino argentina|1win casino online argentina"
        primary_keyword: "1win argentina"
        priority: 0.85
