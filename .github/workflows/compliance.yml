name: Compliance gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compliance-check:
    name: Build site and run compliance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Collect keywords
        run: npm run collect-keywords
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}

      - name: Cluster keywords
        run: npm run cluster
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

      - name: Assign clusters to site
        run: npm run assign-clusters

      - name: Generate content briefs
        run: npm run analyze-serp
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

      - name: Generate page content
        run: npm run generate-content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build static site
        run: npm run build-sites

      - name: Run compliance gate
        run: npm run compliance-check
        env:
          UKGC_REGISTER_LOOKUP_URL: ${{ secrets.UKGC_REGISTER_LOOKUP_URL }}

      - name: Validate JSON-LD schema
        run: npm run validate-schema

      - name: Package zip archive
        run: npm run package-zip

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.md

      - name: Upload site zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 1win-argentina-site
          path: 1win-argentina-site.zip

  deploy:
    name: Deploy (placeholder)
    needs: compliance-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "Wire this step to your hosting provider after compliance-check passes."
